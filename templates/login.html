<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Heaven in a Bite Invoicing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #fffcf8;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md p-8 bg-white border border-[#e0d8cb] rounded-lg shadow-xl relative overflow-hidden">
        <!-- Delicate Golden Top Border Accent -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-[#c5a880]"></div>
        
        <div class="text-center mb-8">
            <!-- Brand Logo Mark -->
            <div class="flex justify-center mb-3">
                <svg class="w-16 h-16 text-[#c5a880]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2,2"/>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1"/>
                    <path d="M 32,58 C 32,58 35,42 50,42 C 65,42 68,58 68,58 C 68,58 71,48 78,50" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M 50,22 C 50,22 53,15 50,12 C 47,15 50,22 50,22 Z" fill="currentColor"/>
                    <circle cx="50" cy="27" r="4" fill="currentColor"/>
                    <path d="M 35,58 L 65,58 C 65,58 66,66 50,66 C 34,66 35,58 35,58 Z" fill="currentColor" opacity="0.8"/>
                    <path d="M 38,68 L 62,68 C 62,68 63,73 50,73 C 37,73 38,68 38,68 Z" fill="#202020"/>
                </svg>
            </div>
            <h1 class="text-3xl serif-font text-stone-900 font-bold tracking-tight">Heaven in a Bite</h1>
            <p class="text-xs tracking-widest text-[#c5a880] uppercase font-semibold mt-1">Studio Invoicing System</p>
        </div>

        {% if error %}
        <div class="p-3 mb-6 text-sm text-red-700 bg-red-50 border border-red-200 rounded-md text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-stone-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required 
                       class="w-full px-4 py-3 rounded-md border border-[#e0d8cb] focus:border-[#c5a880] focus:ring-2 focus:ring-[#c5a880]/20 outline-none transition duration-200 text-stone-900 bg-[#fffcf8]">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                       class="w-full px-4 py-3 rounded-md border border-[#e0d8cb] focus:border-[#c5a880] focus:ring-2 focus:ring-[#c5a880]/20 outline-none transition duration-200 text-stone-900 bg-[#fffcf8]">
            </div>
            <button type="submit" 
                    class="w-full py-3.5 mt-2 bg-[#c5a880] hover:bg-[#aa8c62] active:bg-stone-900 text-white font-bold rounded-md shadow-lg transition duration-200 uppercase tracking-wider text-sm">
                Access System
            </button>
        </form>

        <div class="text-center mt-8 pt-6 border-t border-stone-100">
            <p class="text-xs text-stone-400">Boksburg, South Africa &bull; Powered by Nexera Ventures</p>
        </div>
    </div>
</body>
</html>
